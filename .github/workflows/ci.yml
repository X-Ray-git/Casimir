name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project metadata
        run: npm ci

      - name: Verify extension
        run: npm run check

      - name: Build unpacked-extension archive
        run: npm run package

      - name: Upload extension archive
        uses: actions/upload-artifact@v4
        with:
          name: casimir-extension
          path: dist/*.zip
          if-no-files-found: error
